<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="CVE2PoC — from a CVE ID to every public PoC">
  <defs>
    <!-- Rosé Pine palette -->
    <linearGradient id="wordmark" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="520" y2="0">
      <stop offset="0" stop-color="#c4a7e7"/>
      <stop offset="0.28" stop-color="#9ccfd8"/>
      <stop offset="0.55" stop-color="#ebbcba"/>
      <stop offset="0.8" stop-color="#f6c177"/>
      <stop offset="1" stop-color="#c4a7e7"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-520 0" to="520 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#31748f"/>
      <stop offset="0.35" stop-color="#9ccfd8"/>
      <stop offset="0.65" stop-color="#c4a7e7"/>
      <stop offset="1" stop-color="#ebbcba"/>
    </linearGradient>
    <clipPath id="text-clip">
      <text x="500" y="150" text-anchor="middle" font-family="'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="118" font-weight="800" letter-spacing="4">CVE2PoC</text>
    </clipPath>
  </defs>

  <!-- base card -->
  <rect x="2" y="2" width="996" height="296" rx="22" fill="#191724" stroke="#26233a" stroke-width="2"/>

  <!-- wordmark -->
  <text x="500" y="150" text-anchor="middle" font-family="'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="118" font-weight="800" letter-spacing="4" fill="url(#wordmark)">CVE2PoC</text>

  <!-- specular sweep clipped to the letters -->
  <g clip-path="url(#text-clip)">
    <rect x="-260" y="20" width="180" height="200" fill="#faf4ed" opacity="0.28" transform="skewX(-18)">
      <animate attributeName="x" from="-260" to="1120" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- flower + tagline -->
  <text x="500" y="212" text-anchor="middle" font-family="'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="26" fill="#ebbcba">❀</text>
  <text x="500" y="212" text-anchor="middle" font-family="'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="26" fill="#908caa" dx="22" text-rendering="optimizeLegibility">from a CVE ID to every public PoC</text>

  <!-- gradient hairline -->
  <rect x="360" y="234" width="280" height="3" rx="1.5" fill="url(#rule)"/>

  <!-- twinkling palette dots -->
  <g>
    <circle cx="440" cy="262" r="6" fill="#eb6f92"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="464" cy="262" r="6" fill="#f6c177"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="488" cy="262" r="6" fill="#ebbcba"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="512" cy="262" r="6" fill="#31748f"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="536" cy="262" r="6" fill="#9ccfd8"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="262" r="6" fill="#c4a7e7"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="1.5s" repeatCount="indefinite"/></circle>
  </g>
</svg>
